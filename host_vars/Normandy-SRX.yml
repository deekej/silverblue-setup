---
# vim: filetype=yaml.ansible
# --------------------------
# Configuration (variables) for Normandy-SRX [Desktop]

hostname_FQDN:  Normandy-SRX.deekej.io

kickstart_network_hostname: Normandy-SRX.deekej.io
kickstart_network_devices:
  - enp5s0

# NOTE: The disk id needs to be manually specified before every installation!!
kickstart_disk_id: nvme-Viper_M.2_VPN100_038507051F5D03570715

# This forces the usage of XFS for /boot partition (to support dual boot):
kickstart_multiboot: true

# ---| Partitions Configuration |----------------------------------------------
multiboot:          true
NTFS_mounts:        false

boot_entries:
  - name:           Windows 10 (LTSC)
    EFI_UUID:       2A5C-74A6

#NTFS_mount_points:
#  - device:       /dev/sda1
#    mount_point:  /mnt/Downloads
#
#  - device:       /dev/sdb2
#    mount_point:  /mnt/Storage
#
#  - device:       /dev/sdc1
#    mount_point:  /mnt/Scratch

# ---| System configuration |--------------------------------------------------
laptop_config:        false
redhat_work_config:   true
