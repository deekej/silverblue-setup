---
# vim: filetype=yaml.ansible
# --------------------------
# Configuration (variables) for Normandy-SR3 [Laptop]

hostname_FQDN:  Normandy-SR3.deekej.io

kickstart_network_hostname: Normandy-SR3.deekej.io
kickstart_network_devices:
  - enp0s31f6         # Ethernet
  - wlp0s20f3         # WiFi
  - enp7s0u1u4u4u3    # Docking Station (Pass-through after installation)
  - eth0              # Docking Station (Live USB / Installation)

# NOTE: The disk id needs to be manually specified before every installation!!
kickstart_disk_id: nvme-SanDisk_SSD_Plus_500GB_A3N_25104X802760

# ---| Partitions Configuration |----------------------------------------------
NTFS_mounts:  false

# ---| System configuration |--------------------------------------------------
laptop_config:        true
redhat_work_config:   true
